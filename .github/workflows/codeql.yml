name: CodeQL Security Analysis
on:
  push:
    branches: [main, 'agent/**']
    paths: ['security-study-platform/**', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['security-study-platform/**', '.github/workflows/**']
  schedule:
    - cron: '24 5 * * 6'
  workflow_dispatch:
permissions: { contents: read, security-events: write, packages: read }
jobs:
  analyze:
    name: CodeQL - ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { language: [javascript-typescript, actions] }
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with: { languages: '${{ matrix.language }}', queries: 'security-extended,security-and-quality' }
      - uses: github/codeql-action/analyze@v4
        with: { category: '/language:${{ matrix.language }}' }
