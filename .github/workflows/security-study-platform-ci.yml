name: Security Study Platform - CI, Restart & Pages

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'security-study-platform/**'
      - '.github/workflows/security-study-platform-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'security-study-platform/**'
      - '.github/workflows/security-study-platform-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-study-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKDIR: security-study-platform
  NODE_VERSION: '24'

jobs:
  validate-platform:
    name: Validate, restart smoke test, and collect logs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ============================================================
      # 1. Repository Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. Node.js 24
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      # ============================================================
      # 3. Install Dependencies
      # ============================================================
      - name: Install dependencies
        working-directory: ${{ env.WORKDIR }}
        run: npm install --no-audit --no-fund

      # ============================================================
      # 4. Source / JSON / File Validation
      # ============================================================
      - name: Validate project data and source
        working-directory: ${{ env.WORKDIR }}
        run: |
          node -e "JSON.parse(require('fs').readFileSync('./package.json','utf8')); console.log('package.json valid')"

          node -e "JSON.parse(require('fs').readFileSync('./data/questions.json','utf8')); console.log('questions.json valid')"

          npm test

          test -f public/index.html
          test -f public/app.js
          test -f public/styles.css

          test -f scripts/server-manager.js
          test -f scripts/server-control.js

      # ============================================================
      # 5. Server Manager / Restart Full Smoke Test
      # ============================================================
      - name: Managed server full restart smoke test
        working-directory: ${{ env.WORKDIR }}
        shell: bash

        env:
          PORT: '3000'
          CONTROL_PORT: '3901'

          # CI 전용 재기동 제어 Token
          RESTART_TOKEN: 'ci-restart-token'

          # CI에서는 빠르게 장애를 감지하도록 설정
          HEALTH_INTERVAL_MS: '750'
          HEALTH_TIMEOUT_MS: '750'
          HEALTH_FAILURE_THRESHOLD: '2'
          RESTART_DELAY_MS: '500'

        run: |
          set -euo pipefail

          ARTIFACT_DIR="${RUNNER_TEMP}/security-study-artifacts"
          MANAGER_LOG="${ARTIFACT_DIR}/server-manager.log"

          mkdir -p "$ARTIFACT_DIR"

          # --------------------------------------------------------
          # JSON 값 읽기
          # --------------------------------------------------------
          json_field() {
            node -e "
              const fs = require('fs');
              const j = JSON.parse(
                fs.readFileSync(process.argv[1], 'utf8')
              );
              const v = j[process.argv[2]];
              process.stdout.write(String(v ?? ''));
            " "$1" "$2"
          }

          # --------------------------------------------------------
          # Server Manager Status
          # --------------------------------------------------------
          control_status() {
            curl -fsS \
              -H "x-restart-token: ${RESTART_TOKEN}" \
              "http://127.0.0.1:${CONTROL_PORT}/status"
          }

          # --------------------------------------------------------
          # 서버 준비 대기
          # --------------------------------------------------------
          wait_for_ready() {
            local status_file="$1"

            for i in {1..30}; do

              if control_status > "$status_file" 2>/dev/null \
                && curl -fsS \
                "http://127.0.0.1:${PORT}/api/health" \
                > /dev/null 2>&1
              then
                return 0
              fi

              sleep 1
            done

            echo "Server did not become ready." >&2
            cat "$MANAGER_LOG" >&2 || true

            return 1
          }

          # --------------------------------------------------------
          # PID 변경 대기
          # --------------------------------------------------------
          wait_for_new_pid() {

            local old_pid="$1"
            local status_file="$2"

            local new_pid=""
            local running="false"

            for i in {1..30}; do

              if control_status > "$status_file" 2>/dev/null
              then

                new_pid="$(
                  json_field "$status_file" childPid
                )"

                running="$(
                  json_field "$status_file" running
                )"

                if [ "$running" = "true" ] \
                  && [ -n "$new_pid" ] \
                  && [ "$new_pid" != "$old_pid" ] \
                  && curl -fsS \
                    "http://127.0.0.1:${PORT}/api/health" \
                    > /dev/null 2>&1
                then

                  echo "$new_pid"
                  return 0
                fi
              fi

              sleep 1
            done

            echo "PID did not change from ${old_pid}." >&2
            cat "$MANAGER_LOG" >&2 || true

            return 1
          }

          # --------------------------------------------------------
          # 실패 시 Cleanup
          # --------------------------------------------------------
          cleanup() {

            if [ -f "${ARTIFACT_DIR}/manager.pid" ]
            then

              MANAGER_PID="$(
                cat "${ARTIFACT_DIR}/manager.pid"
              )"

              kill "$MANAGER_PID" 2>/dev/null || true
            fi
          }

          trap cleanup EXIT

          # ========================================================
          # Test 1
          # Managed Server Start
          # ========================================================
          echo "== Start managed server =="

          npm run start:managed \
            > "$MANAGER_LOG" 2>&1 &

          MANAGER_PID=$!

          echo "$MANAGER_PID" \
            > "${ARTIFACT_DIR}/manager.pid"

          wait_for_ready \
            "${ARTIFACT_DIR}/status-before.json"

          curl -fsS \
            "http://127.0.0.1:${PORT}/api/health" \
            > "${ARTIFACT_DIR}/health-before.json"

          BEFORE_PID="$(
            json_field \
            "${ARTIFACT_DIR}/status-before.json" \
            childPid
          )"

          test -n "$BEFORE_PID"

          echo "Initial Server PID = $BEFORE_PID"

          # ========================================================
          # Test 2
          # Restart Token Security
          # ========================================================
          echo "== Verify restart token protection =="

          NO_TOKEN_CODE="$(
            curl \
              -sS \
              -o "${ARTIFACT_DIR}/status-no-token.json" \
              -w '%{http_code}' \
              "http://127.0.0.1:${CONTROL_PORT}/status"
          )"

          test "$NO_TOKEN_CODE" = "401"

          # ========================================================
          # Test 3
          # Manual Restart
          # ========================================================
          echo "== Manual restart =="

          npm run restart \
            > "${ARTIFACT_DIR}/manual-restart-command.json"

          MANUAL_PID="$(
            wait_for_new_pid \
              "$BEFORE_PID" \
              "${ARTIFACT_DIR}/status-after-manual-restart.json"
          )"

          curl -fsS \
            "http://127.0.0.1:${PORT}/api/health" \
            > "${ARTIFACT_DIR}/health-after-manual-restart.json"

          test "$MANUAL_PID" != "$BEFORE_PID"

          echo "Manual Restart PID = $MANUAL_PID"

          # ========================================================
          # Test 4
          # Unexpected Process Exit → Auto Restart
          # ========================================================
          echo "== Unexpected process exit auto-restart =="

          kill -9 "$MANUAL_PID"

          AUTO_PID="$(
            wait_for_new_pid \
              "$MANUAL_PID" \
              "${ARTIFACT_DIR}/status-after-crash-restart.json"
          )"

          curl -fsS \
            "http://127.0.0.1:${PORT}/api/health" \
            > "${ARTIFACT_DIR}/health-after-crash-restart.json"

          test "$AUTO_PID" != "$MANUAL_PID"

          echo "Crash Auto Restart PID = $AUTO_PID"

          # ========================================================
          # Test 5
          # Health Check Failure → Auto Restart
          # ========================================================
          echo "== Health-check failure auto-restart =="

          # 프로세스를 일시 정지하여 Health Check Timeout 유도
          kill -STOP "$AUTO_PID"

          HEALTH_RESTART_REQUESTED="false"

          for i in {1..20}; do

            if grep -q \
              "restart requested reason=health-check-failed" \
              "$MANAGER_LOG"
            then

              HEALTH_RESTART_REQUESTED="true"
              break
            fi

            sleep 1
          done

          test "$HEALTH_RESTART_REQUESTED" = "true"

          # 정지된 프로세스를 다시 깨워 SIGTERM 처리 가능하게 함
          kill -CONT "$AUTO_PID" 2>/dev/null || true

          HEALTH_PID="$(
            wait_for_new_pid \
              "$AUTO_PID" \
              "${ARTIFACT_DIR}/status-after-health-restart.json"
          )"

          curl -fsS \
            "http://127.0.0.1:${PORT}/api/health" \
            > "${ARTIFACT_DIR}/health-after-health-restart.json"

          test "$HEALTH_PID" != "$AUTO_PID"

          echo "Health Auto Restart PID = $HEALTH_PID"

          # ========================================================
          # Test 6
          # Status / Start Commands
          # ========================================================
          echo "== Status and start control commands =="

          npm run status \
            > "${ARTIFACT_DIR}/status-command.json"

          npm run start:service \
            > "${ARTIFACT_DIR}/start-command.json"

          curl -fsS \
            "http://127.0.0.1:${PORT}/api/health" \
            > "${ARTIFACT_DIR}/health-final.json"

          # ========================================================
          # Test 7
          # Graceful Shutdown
          # ========================================================
          echo "== Graceful manager/server stop =="

          npm run stop \
            > "${ARTIFACT_DIR}/stop-command.json"

          for i in {1..20}; do

            if ! kill -0 "$MANAGER_PID" 2>/dev/null
            then
              break
            fi

            sleep 1
          done

          if kill -0 "$MANAGER_PID" 2>/dev/null
          then

            echo "Manager did not stop cleanly." >&2
            exit 1
          fi

          # --------------------------------------------------------
          # Control API 종료 여부 확인
          # --------------------------------------------------------
          if curl -fsS \
            "http://127.0.0.1:${CONTROL_PORT}/status" \
            > /dev/null 2>&1
          then

            echo "Control API is still reachable after stop." >&2
            exit 1
          fi

          # --------------------------------------------------------
          # Manager Log 검증
          # --------------------------------------------------------
          grep -q \
            "health check failed" \
            "$MANAGER_LOG"

          grep -q \
            "restart requested reason=health-check-failed" \
            "$MANAGER_LOG"

          grep -q \
            "정상 종료 완료" \
            "$MANAGER_LOG"

          # ========================================================
          # PID 변경 결과
          # ========================================================
          echo "== PID transition summary =="

          printf \
            'initial=%s\nmanual=%s\ncrash-auto=%s\nhealth-auto=%s\n' \
            "$BEFORE_PID" \
            "$MANUAL_PID" \
            "$AUTO_PID" \
            "$HEALTH_PID" \
            | tee "${ARTIFACT_DIR}/pid-summary.txt"

          trap - EXIT

      # ============================================================
      # 6. Upload Restart Test Logs
      #
      # v4 → v7
      # Node.js 20 Deprecation Warning 제거
      # ============================================================
      - name: Upload restart test logs
        if: always()
        uses: actions/upload-artifact@v7

        with:
          name: security-study-server-restart-logs-${{ github.run_number }}

          path: ${{ runner.temp }}/security-study-artifacts

          if-no-files-found: warn

          retention-days: 14

      # ============================================================
      # 7. GitHub Actions Summary
      # ============================================================
      - name: Write job summary
        if: always()

        run: |
          {
            echo "## Security Study Platform validation"
            echo ""
            echo "- Node.js 24"
            echo "- JSON / Node.js source validation"
            echo "- Express server module load test"
            echo "- Restart token authorization check"
            echo "- Manual restart test"
            echo "- Unexpected-exit automatic restart test"
            echo "- Health-check-failure automatic restart test"
            echo "- Status / start / stop control command test"
            echo "- Graceful shutdown verification"
            echo "- Restart logs uploaded as workflow artifact"
            echo "- actions/upload-artifact@v7"
          } >> "$GITHUB_STEP_SUMMARY"

  # ================================================================
  # GitHub Pages Deployment
  # ================================================================
  deploy-pages:

    name: Deploy study UI to GitHub Pages

    needs:
      - validate-platform

    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main')
      ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')

    runs-on: ubuntu-latest

    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # GitHub Pages Setup
      #
      # v5 → v6
      # Node.js 24 지원
      # ============================================================
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      # ============================================================
      # Upload GitHub Pages Artifact
      #
      # v3 → v5
      # 최신 Node.js Runtime 대응
      # ============================================================
      - name: Upload study site artifact
        uses: actions/upload-pages-artifact@v5

        with:
          path: security-study-platform/public

      # ============================================================
      # Deploy GitHub Pages
      #
      # v4 → v5
      # Node.js 24 대응
      # ============================================================
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # ============================================================
      # Deployment Summary
      # ============================================================
      - name: Write deployment summary
        run: |
          {
            echo "## GitHub Pages deployment"
            echo ""
            echo "### Deployment result"
            echo ""
            echo "- URL: ${{ steps.deployment.outputs.page_url }}"
            echo "- Source: security-study-platform/public"
            echo "- Node.js: 24"
            echo "- configure-pages: v6"
            echo "- upload-pages-artifact: v5"
            echo "- deploy-pages: v5"
          } >> "$GITHUB_STEP_SUMMARY"
