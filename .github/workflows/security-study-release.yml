name: Security Study Platform Release
on:
  workflow_dispatch:
    inputs:
      version: { description: 'Release version, for example 3.0.0', required: true, type: string }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Validate version
        shell: bash
        run: |
          VERSION='${{ inputs.version }}'; [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          PACKAGE_VERSION="$(node -p "require('./security-study-platform/package.json').version")"; test "$VERSION" = "$PACKAGE_VERSION"; ! git rev-parse "v$VERSION" >/dev/null 2>&1
      - working-directory: security-study-platform
        run: npm install --no-audit --no-fund && npm run test:ci
      - run: tar -C security-study-platform/dist -czf "security-study-platform-${{ inputs.version }}.tgz" .
      - env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          git tag "v${{ inputs.version }}"; git push origin "v${{ inputs.version }}"
          gh release create "v${{ inputs.version }}" "security-study-platform-${{ inputs.version }}.tgz" --title "Security Study Platform v${{ inputs.version }}" --notes-file security-study-platform/CHANGELOG.md
