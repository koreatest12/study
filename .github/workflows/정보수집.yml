name: CI/CD - Information Server Continuous Build & Deployment

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  schedule:
    # 6시간마다 기본 브랜치에서 배포 상태를 재검증하고 최신 이미지를 재생성합니다.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: information-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  JAVA_VERSION: '17'
  DEPLOY_ARTIFACT: information-server-deployment-${{ github.run_id }}
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/information-server

jobs:
  # ====================================================================
  # 1. CI - 실행 가능한 서비스, 배포 패키지, Docker Compose 생성
  # ====================================================================
  ci_build:
    name: 1. Build and validate deployment package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📦 레포지토리 체크아웃
        uses: actions/checkout@v7

      - name: 📁 서비스 및 배포 파일 생성
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p spring-boot-app/src/main/java/com/collector/server
          mkdir -p spring-boot-app/src/main/resources
          mkdir -p spring-boot-app/src/test/java/com/collector/server
          mkdir -p python-server
          mkdir -p artifacts/config/network artifacts/logs artifacts/homepage
          mkdir -p deployment

          cat << 'EOF' > spring-boot-app/pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.data.collector</groupId>
            <artifactId>study-server-app</artifactId>
            <version>1.0.0</version>
            <packaging>jar</packaging>
            <properties>
              <maven.compiler.source>17</maven.compiler.source>
              <maven.compiler.target>17</maven.compiler.target>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
          </project>
          EOF

          cat << 'EOF' > spring-boot-app/src/main/java/com/collector/server/Application.java
          package com.collector.server;

          public class Application {
              public static void main(String[] args) {
                  System.out.println("Study information service is ready.");
              }
          }
          EOF

          cat << 'EOF' > spring-boot-app/src/main/resources/application.properties
          server.port=8080
          spring.application.name=study-server-app
          EOF

          cat << 'EOF' > python-server/server.py
          import os
          from pathlib import Path
          from flask import Flask, jsonify, send_from_directory

          homepage_dir = Path(os.environ.get("HOMEPAGE_DIR", "/app/homepage"))
          app = Flask(__name__, static_folder=None)

          @app.get("/")
          def index():
              return send_from_directory(homepage_dir, "index.html")

          @app.get("/health")
          def health():
              return jsonify({"status": "ok", "service": "information-server"})

          @app.get("/api/status")
          def status():
              return jsonify({
                  "status": "running",
                  "service": "information-server",
                  "deployment": os.environ.get("DEPLOYMENT_VERSION", "unknown")
              })

          if __name__ == "__main__":
              app.run(host="0.0.0.0", port=5000)
          EOF

          cat << 'EOF' > python-server/requirements.txt
          Flask>=3.1,<4
          requests>=2.32,<3
          EOF

          cat << EOF > artifacts/config/server_config.txt
          Data Collection Server Configuration: SUCCESS
          Repository: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          Run: ${GITHUB_RUN_ID}
          EOF

          cat << EOF > artifacts/config/network/firewall.txt
          Allow SSH: 22/tcp (external deployment only)
          Allow HTTP: 8080/tcp
          Container service: 5000/tcp
          EOF

          printf 'Deployment generated at %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > artifacts/logs/init.log

          cat << EOF > artifacts/homepage/index.html
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Information Server Deployment</title>
            <style>
              body{font-family:system-ui,sans-serif;max-width:880px;margin:60px auto;padding:0 24px;background:#08111f;color:#e7eef8}
              article{padding:28px;border:1px solid #29415f;border-radius:18px;background:#0f1c2e}
              code{color:#8dd6ff} .ok{color:#74e39a}
            </style>
          </head>
          <body>
            <article>
              <h1>정보 수집 서버</h1>
              <p class="ok">배포 패키지 생성 및 검증 완료</p>
              <p>Repository: <code>${GITHUB_REPOSITORY}</code></p>
              <p>Commit: <code>${GITHUB_SHA}</code></p>
              <p>Health: <code>/health</code> · Status: <code>/api/status</code></p>
            </article>
          </body>
          </html>
          EOF

          cat << 'EOF' > deployment/Dockerfile
          FROM python:3.13-slim
          WORKDIR /app
          ENV PYTHONDONTWRITEBYTECODE=1 \
              PYTHONUNBUFFERED=1 \
              HOMEPAGE_DIR=/app/homepage
          COPY python-server/requirements.txt /app/requirements.txt
          RUN pip install --no-cache-dir -r /app/requirements.txt
          COPY python-server/server.py /app/server.py
          COPY artifacts/homepage /app/homepage
          EXPOSE 5000
          HEALTHCHECK --interval=30s --timeout=5s --start-period=10s --retries=3 \
            CMD python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"
          USER 65534
          CMD ["python", "/app/server.py"]
          EOF

          cat << 'EOF' > deployment/docker-compose.yml
          services:
            information-server:
              build:
                context: ..
                dockerfile: deployment/Dockerfile
              image: information-server:local
              container_name: information-server
              restart: unless-stopped
              environment:
                DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-local}
              ports:
                - "${APP_PORT:-8080}:5000"
          EOF

          echo "✅ 서비스/배포 구조 생성 완료"

      - name: 🐍 Python 설정 및 검증
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🐍 Python 서비스 검증
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r python-server/requirements.txt
          python -m py_compile python-server/server.py

      - name: ☕ Java 17 및 Maven 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: spring-boot-app/pom.xml

      - name: ☕ Java 서비스 빌드
        working-directory: spring-boot-app
        run: mvn -B -q -DskipTests package

      - name: ✅ 배포 패키지 검증
        shell: bash
        run: |
          set -euo pipefail
          test -f spring-boot-app/target/study-server-app-1.0.0.jar
          test -f python-server/server.py
          test -f python-server/requirements.txt
          test -f artifacts/homepage/index.html
          test -f deployment/Dockerfile
          test -f deployment/docker-compose.yml
          grep -q "Allow HTTP: 8080/tcp" artifacts/config/network/firewall.txt
          echo "✅ 모든 배포 산출물 검증 완료"

      - name: 📤 배포 패키지 Artifact 업로드
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DEPLOY_ARTIFACT }}
          path: |
            artifacts/
            spring-boot-app/target/*.jar
            python-server/
            deployment/
          if-no-files-found: error
          retention-days: 30

  # ====================================================================
  # 2. GitHub 기본 배포 - 외부 Secrets 없이 항상 GHCR에 배포 가능
  # ====================================================================
  github_publish:
    name: 2. Publish tested service image to GHCR
    needs: ci_build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 배포 패키지 다운로드
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DEPLOY_ARTIFACT }}
          path: deploy-package

      - name: 🔐 GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 이미지 빌드, 실행, Health Check, Push
        shell: bash
        env:
          DEPLOYMENT_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${GHCR_IMAGE}"
          SHA_TAG="${IMAGE}:${GITHUB_SHA}"
          LATEST_TAG="${IMAGE}:latest"

          docker build --pull \
            -f deploy-package/deployment/Dockerfile \
            -t "$SHA_TAG" \
            deploy-package

          CID="$(docker run -d -p 18080:5000 -e DEPLOYMENT_VERSION="$DEPLOYMENT_VERSION" "$SHA_TAG")"
          cleanup(){ docker rm -f "$CID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              docker logs "$CID" || true
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:18080/api/status
          cleanup
          trap - EXIT

          docker tag "$SHA_TAG" "$LATEST_TAG"
          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"

          {
            echo '## GitHub 상시 배포'
            echo ''
            echo "- GHCR: \`$LATEST_TAG\`"
            echo "- Immutable tag: \`$SHA_TAG\`"
            echo '- Container health check: success'
          } >> "$GITHUB_STEP_SUMMARY"

  # ====================================================================
  # 3. 외부 서버 배포 - Secrets가 있을 때만 추가로 실제 호스트에 반영
  # ====================================================================
  external_deploy:
    name: 3. Optional external server deployment
    needs: ci_build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - name: 📥 배포 패키지 다운로드
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DEPLOY_ARTIFACT }}
          path: deploy-package

      - name: 🔐 외부 배포 가능 여부 검사
        id: deploy_check
        shell: bash
        run: |
          set -euo pipefail
          CAN_DEPLOY=true
          [ -n "$DEPLOY_HOST" ] || CAN_DEPLOY=false
          [ -n "$DEPLOY_USER" ] || CAN_DEPLOY=false
          if [ -z "$DEPLOY_KEY" ] && [ -z "$DEPLOY_PASSWORD" ]; then
            CAN_DEPLOY=false
          fi

          if [ "$CAN_DEPLOY" = true ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
            echo "✅ 외부 서버 배포 자격 정보 확인 완료"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 외부 서버 Secrets 미설정: 외부 SCP만 생략합니다. GHCR 배포는 별도 Job에서 계속 수행됩니다."
          fi

      - name: 🔑 SSH Key 준비
        id: ssh_key
        if: steps.deploy_check.outputs.can_deploy == 'true' && env.DEPLOY_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ssh-keygen -y -f "$KEY_FILE" >/dev/null
          echo "path=$KEY_FILE" >> "$GITHUB_OUTPUT"

      - name: 🔧 Password SSH 도구 준비
        if: steps.deploy_check.outputs.can_deploy == 'true' && env.DEPLOY_KEY == '' && env.DEPLOY_PASSWORD != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: 🚀 SSH Key 방식 외부 배포 및 재기동
        if: steps.deploy_check.outputs.can_deploy == 'true' && env.DEPLOY_KEY != ''
        shell: bash
        env:
          KEY_FILE: ${{ steps.ssh_key.outputs.path }}
        run: |
          set -euo pipefail
          TARGET="${DEPLOY_PATH:-/var/www/data-server}"
          SSH=(ssh -i "$KEY_FILE" -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST")
          SCP=(scp -i "$KEY_FILE" -o StrictHostKeyChecking=accept-new -r)

          "${SSH[@]}" "mkdir -p '$TARGET'"
          "${SCP[@]}" deploy-package/. "$DEPLOY_USER@$DEPLOY_HOST:$TARGET/"
          "${SSH[@]}" "cd '$TARGET' && DEPLOYMENT_VERSION='$GITHUB_SHA' docker compose -f deployment/docker-compose.yml up -d --build --remove-orphans"
          "${SSH[@]}" "cd '$TARGET' && docker compose -f deployment/docker-compose.yml ps"
          "${SSH[@]}" "cd '$TARGET' && for i in \$(seq 1 20); do docker compose -f deployment/docker-compose.yml exec -T information-server python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=3)\" && exit 0; sleep 2; done; docker compose -f deployment/docker-compose.yml logs --tail=100; exit 1"

      - name: 🚀 Password 방식 외부 배포 및 재기동
        if: steps.deploy_check.outputs.can_deploy == 'true' && env.DEPLOY_KEY == '' && env.DEPLOY_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${DEPLOY_PATH:-/var/www/data-server}"
          export SSHPASS="$DEPLOY_PASSWORD"

          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$TARGET'"
          sshpass -e scp -o StrictHostKeyChecking=accept-new -r deploy-package/. "$DEPLOY_USER@$DEPLOY_HOST:$TARGET/"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" "cd '$TARGET' && DEPLOYMENT_VERSION='$GITHUB_SHA' docker compose -f deployment/docker-compose.yml up -d --build --remove-orphans"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" "cd '$TARGET' && docker compose -f deployment/docker-compose.yml ps"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" "cd '$TARGET' && for i in \$(seq 1 20); do docker compose -f deployment/docker-compose.yml exec -T information-server python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=3)\" && exit 0; sleep 2; done; docker compose -f deployment/docker-compose.yml logs --tail=100; exit 1"

      - name: 📋 외부 배포 상태 요약
        if: always()
        shell: bash
        run: |
          {
            echo '## 외부 서버 배포'
            echo ''
            if [ "${{ steps.deploy_check.outputs.can_deploy }}" = 'true' ]; then
              echo '- Secrets: configured'
              echo "- Target: \`${DEPLOY_HOST}:${DEPLOY_PATH:-/var/www/data-server}\`"
              echo '- Deployment method: Docker Compose / restart: unless-stopped'
            else
              echo '- Secrets: not configured'
              echo '- External SCP: skipped by design'
              echo '- GitHub GHCR deployment remains active'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ====================================================================
  # 4. 전체 결과 - main에서는 GHCR 배포 성공을 필수 조건으로 사용
  # ====================================================================
  deployment_result:
    name: 4. Continuous deployment result
    if: always()
    needs:
      - ci_build
      - github_publish
      - external_deploy
    runs-on: ubuntu-latest

    steps:
      - name: ✅ 전체 배포 결과 판정
        shell: bash
        env:
          CI_RESULT: ${{ needs.ci_build.result }}
          GHCR_RESULT: ${{ needs.github_publish.result }}
          EXTERNAL_RESULT: ${{ needs.external_deploy.result }}
        run: |
          {
            echo '## Continuous deployment result'
            echo ''
            echo "- CI package: $CI_RESULT"
            echo "- GHCR deployment: $GHCR_RESULT"
            echo "- External server: $EXTERNAL_RESULT"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Ref: $GITHUB_REF"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CI_RESULT" != 'success' ]; then
            echo 'CI package build failed.'
            exit 1
          fi

          if [ "$GITHUB_REF" = 'refs/heads/main' ] && [ "$GITHUB_EVENT_NAME" != 'pull_request' ] && [ "$GHCR_RESULT" != 'success' ]; then
            echo 'Required GHCR deployment failed.'
            exit 1
          fi

          if [ "$EXTERNAL_RESULT" = 'failure' ]; then
            echo 'External deployment was configured but failed.'
            exit 1
          fi

          echo '✅ Continuous deployment pipeline completed.'
