name: Root Node.js CI

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/node.js.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'server/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/node.js.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Root app - Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22.x'
          - '24.x'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('./package.json','utf8')); console.log('package.json valid')"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build if present
        run: npm run build --if-present

      - name: Run tests
        run: npm test

      - name: Write summary
        if: always()
        run: |
          {
            echo '## Root Node.js CI'
            echo ''
            echo "- Node: ${{ matrix.node-version }}"
            echo '- npm install (package-lock.json is currently absent)'
            echo '- Root server tests executed'
            echo '- security-study-platform changes are handled by the dedicated workflow'
          } >> "$GITHUB_STEP_SUMMARY"
